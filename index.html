<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration & Result Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
  <h2 class="text-center mb-4">Student Registration & Result Portal</h2>
  
  <!-- Registration Form -->
  <form id="studentForm" class="card p-3">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" id="name" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Course</label>
      <select id="course" class="form-select" required>
        <option value="">Select Course</option>
        <option>B.Tech Computer Science (AI&DS)</option>
        <option>BCom</option>
        <option>BA English</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Marks (out of 100)</label>
      <input type="number" id="marks1" class="form-control" placeholder="Subject 1" required>
      <input type="number" id="marks2" class="form-control mt-2" placeholder="Subject 2" required>
      <input type="number" id="marks3" class="form-control mt-2" placeholder="Subject 3" required>
      <input type="number" id="marks4" class="form-control mt-2" placeholder="Subject 4" required>
      <input type="number" id="marks5" class="form-control mt-2" placeholder="Subject 5" required>
    </div>
    <button type="button" class="btn btn-primary" onclick="calculateResult()">Submit</button>
  </form>

  <!-- Result Table -->
  <div class="mt-4">
    <h4>Student Results</h4>
    <table class="table table-bordered" id="resultTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Course</th>
          <th>Total</th>
          <th>Percentage</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

<script src="script.js"></script>
</body>
</html>
